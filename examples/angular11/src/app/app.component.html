<main class="container">
  <h1>Interval Picker — Native Angular 11</h1>
  <p>Angular components, no Lit or custom elements.</p>
  <section class="toolbar">
    <label>Mode
      <select [(ngModel)]="mode">
        <option value="fixed">Fixed</option>
        <option value="relative">Relative</option>
      </select>
    </label>
    <label>Language
      <select [(ngModel)]="locale">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select>
    </label>
    <label>Week start
      <select [(ngModel)]="weekStart">
        <option value="monday">Monday</option>
        <option value="sunday">Sunday</option>
      </select>
    </label>
    <button type="button" (click)="toggle()">{{ isOpen ? 'Close' : 'Open' }}</button>
    <button type="button" (click)="reset()">Reset</button>
  </section>
  <section class="stage">
    <interval-date-picker
      [mode]="mode" (modeChange)="onModeChange($event)"
      [locale]="locale" [weekStart]="weekStart"
      [open]="isOpen" (pickerClose)="onClose()"
      [value]="selectedRange" (rangeChange)="onRangeChange($event)"
    ></interval-date-picker>
  </section>
  <h2>Selected range</h2>
  <pre>{{ selectedRange | json }}</pre>
  <h2>Last event</h2>
  <pre>{{ lastEvent }}</pre>
</main>
